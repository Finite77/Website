<!DOCTYPE html>
    <html>
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Timicity</title>
            <link rel="stylesheet" href="/store/CSS/centralStyle.css">
            <link rel="stylesheet" href="/store/CSS/style.css">
            <link rel="stylesheet" href="/store/CSS/itemPageStyle.css">
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

            <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
            <script defer src="/store/JS/supabase.js"></script>
            <script defer src="/store/JS/checkLogin.js"></script>
            <script defer src="/store/JS/navbar.js"></script>
            <script defer src="/store/JS/script.js"></script>
            <script defer src="/store/JS/productUpdater.js"></script>
            <script defer src="/store/JS/checkoutOnProductPage.js"></script>

            <script defer src="/store/JS/addToBasket.js"> </script>
            <script async defer src="https://www.sandbox.paypal.com/web-sdk/v6/core" onload="window.onLoad2()"></script>
            

            
        </head>
        <body>
            <div class="hidden1 menu-container"></div>
            <nav class="navbar" aria-label="Primary navigation">
                <div class="div-in-navbar">
                    <h1 id="pageTitle"><b>TIMICITY </b></h1>
                    <select id="ProductSelector" aria-label="Select a product">
                        <option value="" selected disabled>Our products</option>
                        
                        <option value="/store/VrMachine.html">VR Machines</option>
                        <option value="/store/massageMachine.html">Massage Machines</option>
                    </select>
                    <a id = 'aboutus'href="/store/aboutUs.html">About Us</a>
                    <!-- <button id = 'login'>Login</button>
                    <button id = 'signUp'>Sign Up</button>
                    <input id="searchBar" type="text" placeholder="⌕ Search..."> -->
                </div>
                <!-- <div class="div-in-navbar-2">
                </div> -->
            </nav>
            <div id="mainImageContainer">
                <img id='mainImage' src="/store/Imagees/blank.jpg" alt="Candy machine placeholder">
            </div>
            <div id="threeImageContainer">
                <img id='secondImage' src="/store/Imagees/blank.jpg" alt="Candy machine placeholder view 1">
                <img id='thirdImage' src="/store/Imagees/blank.jpg" alt="Candy machine placeholder view 2">
                <img id='fourthImage' src="/store/Imagees/blank.jpg" alt="Candy machine placeholder view 3">
            </div>
            <div id="itemDescriptionAddCart">
                <h1 class="paymentLabel">Product...</h1>
                    <div id="priceAndNameContainer">
                        <h2 id="itemName"></h2>
                        <h2 id="itemPrice"></h2>
                    </div>
                <h1 class="paymentLabel">Pay with paypal:</h1>
                    <div id="paypalButtonContainer">
                        <div id="resultMessage" style = "order: 3;"></div>
                    </div>

                <h1 class="paymentLabel">or add to cart:</h1>
                    <div id="cartButtons">
                    <input id="numberToBasket" type="number" min="1" max="10" value="1">
                    <button id="addToBasket">Add To Cart</button>
                    </div>
                
                 <!-- <h2 class="itemName"></h2>
                <p class="itemDescription"></p>
                <p class="itemPrice"></p>
                <label for="itemQuantity"></label>
                 <input type="number" id="itemQuantity" name="quantity" min="1" max="10" step="1" value="1"> -->
                
            </div>
            <div id="itemDescription">
                <h1>Description</h1><br>
                <p class="descriptionText"></p>
            </div>
            <div id="imageVisualiser" class = 'hidden'>
                <button id="remove">X</button>
                <img id = "visualiserImage">

            </div>
        </body>
    </html>
